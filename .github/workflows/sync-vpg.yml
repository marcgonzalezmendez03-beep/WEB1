name: Sync VPG competitions
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and parser
        run: |
          python -m pip install playwright httpx beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Read VPG league pages
        run: python scripts/sync_vpg_browser.py
      - name: Commit only verified changes
        run: |
          if ! git diff --quiet -- data/vpg.json data/bronze.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/vpg.json data/bronze.json
            git commit -m "Update verified VPG standings"
            git push
          fi
